[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vixcast"
version = "1.0.0"
description = "Walk-forward forecasting of the VIX with HAR and GARCH-family models, with rigorous point and interval evaluation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Anthony Ge" }]
keywords = ["volatility", "VIX", "GARCH", "HAR", "forecasting", "quant", "time-series"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "arch>=6.3",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[project.scripts]
vixcast = "vixcast.cli:main"

[project.urls]
Repository = "https://github.com/SomeGuy966/implied-volatility-forecasting"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vixcast = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["N803", "N806", "RUF001"]  # math-style variable names; typographic dashes in text

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["arch.*", "yfinance.*", "joblib.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::arch.utility.exceptions.ConvergenceWarning",
    "ignore::arch.utility.exceptions.DataScaleWarning",
]
